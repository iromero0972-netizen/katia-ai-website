*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 15%,rgba(31,91,255,.18),#03060f 70%);color:var(--ink);font-family:'Inter',system-ui,sans-serif;text-align:center;padding:32px;-webkit-font-smoothing:antialiased}

.ghost:hover{border-color:rgba(58,120,255,.5)}
.meta{margin-top:32px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--ink-mute);letter-spacing:.02em}

<script>
(function(){
  var lang='es';

  document.title='Page not found — KATIA.AI';
  document.querySelectorAll('[data-en]').forEach(function(el){el.textContent=el.getAttribute('data-en');});
})();
