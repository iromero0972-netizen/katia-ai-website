name: IndexNow submit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
permissions:
  contents: read
jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit only URLs already available in the public sitemap
        run: python3 scripts/submit-indexnow.py --submit
